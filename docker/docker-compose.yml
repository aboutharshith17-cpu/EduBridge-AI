services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edubridge
      POSTGRES_PASSWORD: edubridge123
      POSTGRES_DB: edubridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edubridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: edubridge
      MONGO_INITDB_ROOT_PASSWORD: edubridge123
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://edubridge:edubridge123@postgres:5432/edubridge
      MONGODB_URL: mongodb://edubridge:edubridge123@mongodb:27017/edubridge?authSource=admin
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  chromadb:
    image: chromadb/chroma:0.4.22
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  celery:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://edubridge:edubridge123@postgres:5432/edubridge
      MONGODB_URL: mongodb://edubridge:edubridge123@mongodb:27017/edubridge?authSource=admin
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - redis
      - postgres
      - mongodb

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  chroma_data:
